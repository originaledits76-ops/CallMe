name: Build CallMe APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: callme-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download the repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Android SDK tools
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install the Android SDK platform and build tools
      - name: Install Android SDK components
        run: |
          set -e
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      # 5. Install the Gradle version required by this project
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 6. Create the expected debug keystore if missing
      - name: Prepare debug signing key
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      # 7. Build the debug APK
      - name: Build debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      # 8. Verify that the APK exists
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # 9. Upload the APK for downloading
      - name: Upload CallMe Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CallMe-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
